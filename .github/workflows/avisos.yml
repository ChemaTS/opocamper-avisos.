name: Avisos OpoCamper
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      test_admins:
        description: 'Mandar un aviso de prueba al admin'
        type: boolean
        default: false
concurrency: avisos
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Credenciales
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Mandar avisos
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          TEST_ADMINS: ${{ inputs.test_admins }}
        run: |
          node send.mjs 2>&1 | tee out.txt || (echo "::error::$(tail -3 out.txt | tr '\n' ' ')" && exit 1)
          while IFS= read -r l; do echo "::notice::$l"; done < out.txt
